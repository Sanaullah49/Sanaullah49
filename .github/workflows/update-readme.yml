name: Sync README from thesanaullah.dev

on:
  schedule:
    # 03:40 UTC — twenty minutes after the portfolio's own nightly refresh
    # (03:17 UTC, in the portfolio repo), so the numbers are already fresh.
    - cron: '40 3 * * *'
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the generated README
        run: |
          code=$(curl -sS -o README.next -w '%{http_code}' --max-time 60 \
            https://thesanaullah.dev/api/github-readme)
          echo "HTTP $code"

          if [ "$code" != "200" ]; then
            echo "::error::Endpoint returned HTTP $code"
            exit 1
          fi

          # A deploy mid-fetch, or a database blip, could return a short error
          # page with a 200. Never overwrite a good README with one.
          size=$(wc -c < README.next)
          if [ "$size" -lt 500 ]; then
            echo "::error::Response was only ${size} bytes — refusing to overwrite"
            cat README.next
            exit 1
          fi

          mv README.next README.md

      - name: Commit if anything changed
        run: |
          # The generated markdown carries no timestamp, so a diff here means
          # the portfolio actually changed — no daily no-op commits.
          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: sync README from thesanaullah.dev'
          git push
